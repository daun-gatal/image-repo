name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - airflow
          - pyspark
          - cp-kafka-connect
          - opencode
          - code-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ======================================
      # 🔎 Check whether this service changed
      # ======================================
      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '${{ matrix.service }}/Dockerfile'
              - '${{ matrix.service }}/**/*'

      # ======================================
      # 📦 Read Version
      # ======================================
      - name: Read version
        if: steps.filter.outputs.src == 'true'
        id: version
        run: |
          VERSION=$(cat "${{ matrix.service }}/VERSION")

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          echo "Service: ${{ matrix.service }}"
          echo "Version: ${VERSION}"

      # ======================================
      # 🔍 Lint Dockerfile
      # ======================================
      - name: Lint Dockerfile
        if: steps.filter.outputs.src == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
          config: .hadolint.yaml

      # ======================================
      # 🐳 Setup Docker Buildx
      # ======================================
      - name: Set up Docker Buildx
        if: steps.filter.outputs.src == 'true'
        uses: docker/setup-buildx-action@v3

      # ======================================
      # 🧪 Validate Dockerfile
      # ======================================
      - name: Validate Dockerfile
        if: steps.filter.outputs.src == 'true' && github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            validation/${{ matrix.service }}:${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # ======================================
      # 🔐 Login to GHCR
      # ======================================
      - name: Login to GHCR
        if: steps.filter.outputs.src == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ======================================
      # 🚀 Build & Push
      # ======================================
      - name: Build and Push
        if: steps.filter.outputs.src == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
